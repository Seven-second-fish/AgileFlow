version: 1
steps:
  - id: af-req
    mode: strict
    prompt: atlas/role/role-req.md
    depends:
      - atlas/agileflow.env
      - atlas/glossary.md
    outputs:
      - atlas/requirements/REQ-*.md
      - atlas/requirements/README.md
      - atlas/requirements/ui/UID-*.md
      # 有线框原型时再落盘 requirements/ui 下 prototypes 目录（勿列入 outputs，否则无原型永远卡在 af-req）

  - id: af-mod
    mode: orch
    prompt: atlas/role/role-model.md
    criteria:
      - "无新业务实体、无状态机、无跨表不变式 → 可判定 skip"
      - "仅字段级微调且已有 model 覆盖 → 可判定 skip 或增量"
      - "新实体 / 状态机 / 权限主体变化 → 必须执行（禁止 skip）"
      - "拿不准 → 按执行，禁止为赶工 skip"
    depends:
      - atlas/requirements/REQ-*.md
    outputs:
      - atlas/model/README.md
      - atlas/model/conceptual/entity-relations.md
      - atlas/model/conceptual/domain-rules.md
      - atlas/model/entities/*.md
      - atlas/model/physical/schema.md

  - id: af-sol
    mode: strict
    prompt: atlas/role/role-sol.md
    depends:
      - atlas/requirements/REQ-*.md
      - atlas/model/
    outputs:
      - atlas/solution/README.md
      - atlas/solution/features/F-*.md
      - atlas/solution/contracts/
      - atlas/solution/architecture.md
      # code-patterns-*.md 按需落盘，勿列入 outputs（否则无写法锚点永远卡在 af-sol）
      - atlas/todo.md

  - id: af-dev
    mode: strict
    prompt: atlas/role/role-dev.md
    depends:
      - atlas/todo.md
      - atlas/solution/features/F-*.md
      - atlas/requirements/REQ-*.md
      - atlas/solution/contracts/
    outputs:
      - atlas/dev/T-*-*.md

  - id: af-test
    mode: strict
    prompt: null
    depends:
      - atlas/todo.md
      - atlas/dev/T-*-*.md
      - atlas/requirements/REQ-*.md
      - atlas/tests/
    outputs:
      - atlas/tests/REQ-*-验收报告.md
      - atlas/tests/README.md
      # fe-pixel / fe-smoke 由 test-entry 模块按 FE 探测硬验；勿列入 outputs（无 FE 永远卡 af-test）
